name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check && cargo clippy --locked -- -D warnings && cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build --locked && c++ -O1 examples/cpp_fixture.cpp -o target/cpp_fixture
      - run: python3 tests/functional.py && node --test tests/dashboard.test.js
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests tools --select E4,E7,E9,F && ruff format --check src tests tools
